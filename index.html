<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#1c1b1f" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap"
      rel="stylesheet"
    />

    <title>Deutsch A1 — Study with ru</title>
    <meta
      name="description"
      content="Aplikasi belajar bahasa Jerman level A1: flashcard spaced repetition, latihan der/die/das, konjugasi, tata bahasa, latihan mendengar dan kuis. Gratis, tanpa akun."
    />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Deutsch A1 — Study with ru" />
    <meta
      property="og:description"
      content="Belajar bahasa Jerman A1 langsung di browser: kosakata, artikel, konjugasi, grammar, hören dan kuis."
    />
    <meta property="og:image" content="/og-image.svg" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Applied before first paint so dark mode never flashes light. -->
    <script>
      try {
        var saved = localStorage.getItem('de-theme')
        var dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
        if (dark) document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
